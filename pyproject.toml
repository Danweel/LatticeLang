[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

# -----------------------------------------------------------------
# PEP 621 Metadata
# -----------------------------------------------------------------
[project]
name = "latticelang"
version = "0.0.1"
description = "LatticeLang is a libre, open-source tool for constructing natural-sounding languages."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Danweel", email = "daniil.woodland@pm.me"}
]
requires-python = ">=3.11"

# -----------------------------------------------------------------
# Optional Dependencies (PEP 621 Extras)
# -----------------------------------------------------------------
# RTD uses:    pip install .[docs]
# Local dev:   poetry install --extras dev
#
# 'dev' includes everything in 'docs' via the self-reference
# "latticelang[docs]", so --extras dev gives you docs + linting +
# testing in one command.

[project.optional-dependencies]
docs = [
    "sphinx>=8.0,<9.0",
    "furo>=2024.8.6",
    "sphinxcontrib-mermaid>=2.0.0",
    "sphinx-notfound-page>=1.0.0",
    "sphinx-copybutton>=0.5.2",
    "myst-parser>=5.0.0,<6.0.0",
    "sphinx-design>=0.6.0,<1.0",
    "linkify-it-py>=2.0.0",
    "sphinx-autobuild>=2024.10.0",
    "sphinxcontrib-bibtex>=2.5,<3.0",
    "sphinx-togglebutton>=0.3.0",
]
dev = [
    "sphinx>=8.0,<9.0",
    "furo>=2024.8.6",
    "sphinxcontrib-mermaid>=2.0.0",
    "sphinx-notfound-page>=1.0.0",
    "sphinx-copybutton>=0.5.2",
    "myst-parser>=5.0.0,<6.0.0",
    "sphinx-design>=0.6.0",
    "linkify-it-py>=2.0.0",
    "sphinx-autobuild>=2024.10.0",
    "sphinxcontrib-bibtex>=2.5,<3.0",
    "sphinx-togglebutton>=0.3.0",
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

# -----------------------------------------------------------------
# Poetry Configuration
# -----------------------------------------------------------------
[tool.poetry]
package-mode = true
packages = [{include = "latticelang", from = "src"}]

[tool.poetry.scripts]
latticelang = "latticelang.cli:main"

# -----------------------------------------------------------------
# Pytest Configuration
# -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

# -----------------------------------------------------------------
# Ruff Linter Configuration
# -----------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"docs/source/conf.py" = ["E501"]