[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

# -----------------------------------------------------------------
# PEP 621 Metadata (Project Info)
# -----------------------------------------------------------------
[project]
name = "latticelang"
version = "0.0.1"
description = "LatticeLang is a libre, open-source tool for constructing natural-sounding languages."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Danweel", email = "daniil.woodland@pm.me"}
]
requires-python = ">=3.11"

# -----------------------------------------------------------------
# Poetry configuration
# -----------------------------------------------------------------
[tool.poetry]
package-mode = true
packages = [{include = "latticelang", from = "src"}]  # for structure LatticeLang/src/latticelang/_init_.py

[tool.poetry.scripts]
latticelang = "latticelang.cli:main"  # CLI entry point

# -----------------------------------------------------------------
# CI test configuration
# -----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]  # Or wherever your tests live
python_files = ["test_*.py"]
addopts = "-v --tb=short"


# -----------------------------------------------------------------
# Ruff linter configuration
# -----------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint.per-file-ignores]
"docs/source/conf.py" = ["E501"]  # Allow long lines in conf.py

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]

# -----------------------------------------------------------------
# Dependency Groups
# -----------------------------------------------------------------
# These are used with: poetry install --with docs OR --with dev

[tool.poetry.group.docs.dependencies]
sphinx = "^8.0"
furo = "^2025.12.19"
sphinxcontrib-mermaid = "^2.0.1"
sphinx-notfound-page = "^1.0.0"
sphinx-copybutton = "^0.5.2"
myst-parser = "^5.0.0"
sphinx-design = "^0.7.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6"
pytest = "^8.0"  # Uncomment if you add testing later
pytest-cov = "^5.0"  # For coverage reporting in CI