[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

# -----------------------------------------------------------------
# PEP 621 Metadata
# -----------------------------------------------------------------
[project]
name = "latticelang"
version = "0.0.1"
description = "LatticeLang is a libre, open-source tool for constructing natural-sounding languages."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Danweel", email = "daniil.woodland@pm.me"}
]
requires-python = ">=3.11"

# Optional Dependencies (PEP 621 Extras)
# -----------------------------------------------------------------
# RTD uses:    pip install .[docs]
# Local dev:   poetry install --extras docs --with dev
#
# The docs extra holds the Sphinx stack for external installers
# (RTD). Dev tooling lives in the Poetry dependency group below
# (ADR-053, 2026-10-31); the former duplicated `dev` extra is
# retired. (History: Poetry rejected the self-reference fix —
# "Package 'latticelang[docs]' is listed as a dependency of
# itself", 2026-10-30 — so the group is the one-master solution.)

[project.optional-dependencies]
docs = [
    "sphinx>=8.0,<9.0",
    "furo>=2024.8.6",
    "sphinxcontrib-mermaid>=2.0.0",
    "sphinx-notfound-page>=1.0.0",
    "sphinx-copybutton>=0.5.2",
    "myst-parser>=5.0.0,<6.0.0",
    "sphinx-design>=0.6.0,<1.0",
    "linkify-it-py>=2.0.0",
    "sphinx-autobuild>=2024.10.0",
    "sphinxcontrib-bibtex>=2.5,<3.0",
    "sphinx-togglebutton>=0.3.0",
]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6"
pytest = ">=8.0"
pytest-cov = ">=5.0"

# -----------------------------------------------------------------
# Poetry Configuration
# -----------------------------------------------------------------
[tool.poetry]
package-mode = true
packages = [{include = "latticelang", from = "src"}]

# -----------------------------------------------------------------
# Pytest Configuration
# -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

# -----------------------------------------------------------------
# Ruff Linter Configuration
# -----------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"docs/source/conf.py" = ["E501"]
