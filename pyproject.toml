[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

# -----------------------------------------------------------------
# PEP 621 Metadata (Project Info)
# -----------------------------------------------------------------
[project]
name = "latticelang"
version = "0.0.1"
description = "LatticeLang is a libre, open-source tool for constructing natural-sounding languages."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Danweel", email = "daniil.woodland@pm.me"}
]
requires-python = ">=3.11"

# -----------------------------------------------------------------
# This is what RTD reads
# -----------------------------------------------------------------
[project.optional-dependencies]
docs = [
    "sphinx>=8.0,<9.0",       # Pin major version to avoid breaking changes
    "furo>=2024.8.6",
    "sphinxcontrib-mermaid>=2.0.0",
    "sphinx-notfound-page>=1.0.0",
    "sphinx-copybutton>=0.5.2",
    "myst-parser>=5.0.0,<6.0.0",
    "sphinx-design>=0.6.0",
    "sphinx-autobuild>=2024.10.0",
]
dev = [
    "sphinx>=8.0,<9.0",
    "furo>=2024.8.6",
    "sphinxcontrib-mermaid>=2.0.0",
    "sphinx-notfound-page>=1.0.0",
    "sphinx-copybutton>=0.5.2",
    "myst-parser>=5.0.0,<6.0.0",
    "sphinx-design>=0.6.0",
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "sphinx-autobuild>=2024.10.0",
]

# -----------------------------------------------------------------
# Poetry configuration (for local development)
# -----------------------------------------------------------------
[tool.poetry]
package-mode = true
packages = [{include = "latticelang", from = "src"}]  # for structure LatticeLang/src/latticelang/_init_.py

[tool.poetry.scripts]
latticelang = "latticelang.cli:main"  # CLI entry point


# -----------------------------------------------------------------
# Dependency Groups
# -----------------------------------------------------------------
# These are used with: poetry install --with docs OR --with dev

[tool.poetry.group.docs.dependencies]
sphinx = ">=8.0,<9.0"
furo = ">=2024.8.6"
sphinxcontrib-mermaid = ">=2.0.0"
sphinx-notfound-page = ">=1.0.0"
sphinx-copybutton = ">=0.5.2"
myst-parser = "5.0.0,<6.0.0"
sphinx-design = ">=0.6.0"
linkify-it-py = "^2.0.0"
sphinx-autobuild = "^2024.10.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6"
pytest = ">=8.0"
pytest-cov = ">=5.0"

# -----------------------------------------------------------------
# CI test configuration
# -----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]  # Or wherever your tests live
python_files = ["test_*.py"]
addopts = "-v --tb=short"


# -----------------------------------------------------------------
# Ruff linter configuration
# -----------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"docs/source/conf.py" = ["E501"]  # Allow long lines in conf.py